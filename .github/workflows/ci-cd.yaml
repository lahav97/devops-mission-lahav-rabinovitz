name: CI/CD

# ---- Triggers ----
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "terraform/**"
      - "k8s/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]

# One run at a time, so tag commits never race each other
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---- Job 1: checks (every push and PR) ----
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # App tests
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: app
      - name: Run tests
        run: npm test
        working-directory: app

      # Terraform format and validation
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: terraform
      - name: Terraform validate
        run: terraform init -backend=false && terraform validate
        working-directory: terraform

      # Manifests must render
      - name: Render Kustomize manifests
        run: kubectl kustomize k8s

  # ---- Job 2: build, push, update tag (main only) ----
  build-and-deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the new tag
      packages: write # push to GHCR
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      # Multi-arch: amd64 runners, arm64 kind nodes on Apple Silicon
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitOps: change the tag in git, Argo CD does the rollout
      - name: Update image tag
        run: |
          yq -i '.images[0].newName = strenv(IMAGE) | .images[0].newTag = strenv(GITHUB_SHA)' k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "chore(deploy): update image to ${GITHUB_SHA::7}"
          git pull --rebase
          git push