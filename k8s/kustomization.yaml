# ---- Kustomize entry point (Argo CD renders this folder) ----
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-app

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# ---- Image tag (the only field CI will change in Part 3) ----
images:
  - name: devops-exercise
    newTag: local